<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-blue-600">CBT Online</h1>
      <p class="text-sm text-gray-500 mt-1">Silakan masuk menggunakan akun Anda</p>
    </div>

    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <!-- Placeholder dan ID disesuaikan -->
        <input type="text" id="username" placeholder="Masukkan Username" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Masuk</button>
      <p id="alert-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
    </form>
  </div>

  <!-- Script Dasar untuk Memproses Login -->
  <script src="script.js"></script>
</body>
</html>
